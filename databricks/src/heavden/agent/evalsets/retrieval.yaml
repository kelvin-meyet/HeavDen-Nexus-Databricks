# Retrieval eval set for the document (RAG) tool. Seeds the Phase 4 agent eval set (Plan.md §11).
# Each question names the document (and optionally version / section substring) that answers it.
# doc_id: null marks questions the corpus does NOT answer: the assistant should decline them.
# as_of: answer with the documents in force on that date (default: current versions).

questions:
  # Escalation protocol (current = v2.0)
  - question: What NEWS2 score means I should call the rapid response team?
    doc_id: HD-CLIN-001
    version: "2.0"
    section: Escalation by NEWS2
  - question: What should a nurse do when a patient's risk band turns High?
    doc_id: HD-CLIN-001
    version: "2.0"
    section: Escalation by risk band
  - question: What changed in the new escalation protocol?
    doc_id: HD-CLIN-001
    version: "2.0"
    section: What changed
  - question: What are proactive review rounds?
    doc_id: HD-CLIN-001
    version: "2.0"
    section: What changed
  - question: How quickly should the outreach nurse see a patient with a single red score?
    doc_id: HD-CLIN-001
    version: "2.0"
  - question: Which outcomes count as an escalation for the model's labels?
    doc_id: HD-CLIN-001
    section: Documentation

  # Escalation protocol, as it was before the change
  - question: What NEWS2 score triggered an emergency rapid response call?
    doc_id: HD-CLIN-001
    version: "1.0"
    section: Escalation by NEWS2
