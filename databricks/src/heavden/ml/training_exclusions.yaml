# Data the model must not learn from, per catalog (read by heavden.ml.training).
#
# When a data fault is diagnosed (a sensor reading wrong, a broken feed), the readings are still
# in Silver and Gold: they are what the ward saw, and the prediction log and dashboards keep
# them. But a model trained, calibrated or judged on them would learn the fault. An entry here
# removes those patient-hours from training, validation and test from the next training run on,
# and from every model's reference (what the drift check and the monitor's baseline compare new
# data with) from the next check on. A version's monitor baseline is written once: if a fault
# inside an existing version's days is added later, delete that version's rows from
# monitoring.inference_baseline and the next scoring run writes them again.
# Entries are added by pull request when the incident is closed (Drift Incident Runbook, 5.1),
# so each one is reviewed and dated in git. Only data faults belong here, never real changes on
# the ward (an outbreak, a new protocol): those are what a retrain has to learn.
#
#   site_id   the affected site, or "all"
#   from, to  first and last affected prediction hour (UTC). Features look back 6 hours, so
#             `to` is 6 hours after the last faulty reading.
#   reason    the incident, e.g. the field safety notice

heavden_dev: []
heavden_staging:
  - site_id: SITE_B
    from: "2026-09-22T13:00:00Z"
    to: "2026-09-24T06:00:00Z"
    reason: "Episode 1 (rehearsal): Site B SpO2 sensors read low, 22 Sep 12:00 to 24 Sep 00:00"
  - site_id: all
    from: "2026-09-26T07:00:00Z"
    to: "2026-09-28T06:00:00Z"
    reason: "Episode 3 (rehearsal): firmware 3.2.0 sent etco2 and no motion, 26 Sep 06:00 to 28 Sep 00:00, then rolled back"
heavden_prod:
  - site_id: SITE_B
    from: "2026-10-04T13:00:00Z"
    to: "2026-10-06T06:00:00Z"
    reason: "Episode 1: Site B SpO2 sensors read low (field safety notice FSN-2026-10), 4 Oct 12:00 to 6 Oct 00:00"
