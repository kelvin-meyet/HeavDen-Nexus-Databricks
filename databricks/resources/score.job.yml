# Score every patient-hour with the registered model and rebuild the Gold tables that depend on
# it: risk_scores, alerts_fact, escalations_fact, site_kpis_hourly (Plan.md §9; code in
# src/heavden/ml/batch_scoring.py, run through src/jobs/score_model.py). No schedule: staging
# scores after every merge (CI), prod on demand (prod-run workflow, approved), and in Phase 3
# after each drift episode. Prod uses @champion; dev and staging the newest version, because
# their 2-day models rarely pass the gates.
resources:
  jobs:
    score:
      name: heavden-score
      description: Scores ${var.catalog}.gold.patient_hour_features with the registered model and rebuilds the risk, alert, escalation and KPI tables.
      max_concurrent_runs: 1 # each run replaces the four tables
      performance_target: STANDARD
      timeout_seconds: 1800
      tags:
        project: heavden
        component: scoring
      tasks:
        - task_key: score
          environment_key: ml
          spark_python_task:
            python_file: ../src/jobs/score_model.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --model-alias
              - ${var.scoring_model}
              - --train-days
              - ${var.train_days}
              - --valid-days
              - ${var.valid_days}
      environments:
        # Same environment as training, so the model loads with the libraries it was trained with.
        - environment_key: ml
          spec:
            environment_version: "6"
            dependencies:
              - ../../dist/*.whl
              - lightgbm==4.6.0
