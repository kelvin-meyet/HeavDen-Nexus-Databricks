# Train, evaluate and register the deterioration-risk model (Plan.md §8; code in
# src/heavden/ml/training.py, run through src/jobs/train_model.py). No schedule: staging trains
# after every merge (CI smoke test on 2 days), prod trains on demand (prod-run workflow, approved).
# Each run logs every candidate to the experiment `training` (training.experiment.yml) and registers the chosen model as a new
# version of <catalog>.ml.deterioration_risk (@challenger if it passes the gates, and @champion
# only for the first model).
resources:
  jobs:
    train:
      name: heavden-train
      description: Trains the deterioration-risk model on ${var.catalog}.gold.training_set and registers it in Unity Catalog.
      max_concurrent_runs: 1
      performance_target: STANDARD # cost-efficient serverless; a slower start is fine for training
      timeout_seconds: 3600
      tags:
        project: heavden
        component: training
      tasks:
        - task_key: train
          environment_key: ml
          spark_python_task:
            python_file: ../src/jobs/train_model.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --experiment-id
              - ${resources.experiments.training.id}
              - --train-days
              - ${var.train_days}
              - --valid-days
              - ${var.valid_days}
      environments:
        # Serverless environment 6 already has pandas, numpy, scikit-learn and MLflow at the
        # versions our package asks for (databricks/requirements-serverless-env6.txt); we add
        # LightGBM and the project wheel.
        - environment_key: ml
          spec:
            environment_version: "6"
            dependencies:
              - ../../dist/*.whl
              - lightgbm==4.6.0
