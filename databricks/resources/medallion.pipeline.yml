# Bronze -> Silver -> Gold Lakeflow pipeline (Plan.md §7.2-7.4; code in src/pipelines/medallion,
# transformations in src/heavden/pipelines). No schedule: it runs on demand after the generator
# and sql_ingest have landed new data, and later as a task of the baseline and drift_episode jobs.
# Each run processes what's new and stops (triggered, not continuous).
resources:
  pipelines:
    medallion:
      name: heavden-medallion
      catalog: ${var.catalog}
      schema: bronze # default for unqualified names; Silver and Gold tables name their schema
      serverless: true
      continuous: false
      channel: CURRENT
      # Added to sys.path, so the pipeline files import the tested heavden.pipelines code.
      root_path: ../src
      libraries:
        - glob:
            include: ../src/pipelines/medallion/**
      configuration:
        heavden.landing: /Volumes/${var.catalog}/bronze/landing
      # Queryable event log (expectation results, row counts) for the data-quality panel.
      event_log:
        catalog: ${var.catalog}
        schema: monitoring
        name: medallion_event_log
      tags:
        project: heavden
        component: medallion
