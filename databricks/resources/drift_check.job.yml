# Compare the latest day of data, predictions and alerts, and the latest labelled hours, with
# the model's training data and validation scores; append every signal to
# monitoring.drift_metrics and one summary row to monitoring.drift_checks (Plan.md §10; code in
# src/heavden/monitoring/drift_check.py, run through src/jobs/check_drift.py). First it creates
# the Lakehouse Monitoring monitor on monitoring.inference_log if it's missing (as this job's
# identity, so the environment's service principal owns it), refreshes it and waits (~15 min;
# Plan.md §10.5), then records the monitor's numbers next to its own as shadow rows and checks
# that the two agree where they measured the same thing (the monitor never decides). It reports;
# the workflow that runs it opens a retrain request on "act". No schedule: staging checks after
# every merge (CI) and each staging-run, prod on demand (prod-run workflow).
resources:
  jobs:
    drift_check:
      name: heavden-drift-check
      description: Refreshes the Lakehouse Monitoring monitor, then measures input, prediction, alert-load, performance and data-quality drift in ${var.catalog} against the model's training data, and logs it to the monitoring schema.
      max_concurrent_runs: 1
      parameters:
        - name: episode
          default: ""
      performance_target: STANDARD
      timeout_seconds: 3600 # includes waiting for the monitor's refresh
      tags:
        project: heavden
        component: monitoring
      tasks:
        - task_key: check
          environment_key: ml
          spark_python_task:
            python_file: ../src/jobs/check_drift.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --model-alias
              - ${var.scoring_model}
              - --train-days
              - ${var.train_days}
              - --valid-days
              - ${var.valid_days}
              - --episode
              - "{{job.parameters.episode}}"
              - --assets-dir
              - ${workspace.root_path}/monitoring
      environments:
        # The scoring environment: the check scores the training block with the model.
        - environment_key: ml
          spec:
            environment_version: "6"
            dependencies:
              - ../../dist/*.whl
              - lightgbm==4.6.0
