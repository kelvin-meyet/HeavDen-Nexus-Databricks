# Lint and unit tests on every pull request and on main (Plan.md §16, Phase 0).
# Later phases add jobs here: `databricks bundle validate` and a dev deploy on PRs (Phase 1),
# the staging deploy, integration tests and the agent eval gate on main (Phases 1-4).

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ingest_sql:
        description: "Staging: also copy the Azure SQL source into Bronze (wakes the database)"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push cancels an older PR run, but never a deploy on main halfway through.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      # The notebooks group (Jupyter, matplotlib) isn't needed to lint or test. The spark group
      # runs the pipeline transformations on local Spark, with the runner's Java 17 (JAVA_HOME).
      - name: Install dependencies
        run: uv sync --locked --group dev --group rag --group backend --group spark

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check notebooks are committed without outputs
        run: uv run nbstripout --verify notebooks/**/*.ipynb

      - name: Unit tests
        run: uv run pytest -q

  # The ML code against the library versions Databricks serverless environment 6 provides (the
  # training and scoring jobs run there), not just the newer ones in uv.lock: a model trained on
  # Databricks must also be built, scored and explained by the versions installed there.
  ml-on-databricks-libraries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the package with serverless environment 6 versions
        run: |
          uv venv
          # full MLflow at the runtime's version, for the local tracking store the training tests use
          uv pip install -e . pytest mlflow==3.12.0 -c databricks/requirements-serverless-env6.txt

      - name: ML tests
        run: >
          .venv/bin/python -m pytest -q -W error::DeprecationWarning
          tests/test_features.py tests/test_train.py tests/test_evaluate_explain.py
          tests/test_scoring_gold.py tests/test_drift_metrics.py tests/test_package.py
          tests/test_training.py tests/test_batch_scoring.py tests/test_model_ops.py
          tests/test_profiling.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  # Checks every target resolves (variables, paths, permissions) as the dev service principal,
  # which can't read or write any data. Dev itself is deployed by hand.
  bundle-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: azure-cli
    defaults:
      run:
        working-directory: databricks
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - uses: databricks/setup-cli@v1.17.0
        with:
          version: 1.17.0

      - name: Validate every target
        run: |
          for target in dev staging prod; do
            databricks bundle validate --strict -t "$target"
          done

  # Every change merged to main is deployed to staging as the staging service principal, then the
  # pipeline rebuilds Bronze -> Silver -> Gold on the fixed seeded data (about $0.10-0.35 a run).
  # Azure SQL is read only on the first run or on request: each read can wake the free database.
  staging:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [lint-and-test, ml-on-databricks-libraries, bundle-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 90 # the drift check waits for the monitor's refresh (~15-25 min)
    environment: staging
    concurrency:
      group: staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: azure-cli
    defaults:
      run:
        working-directory: databricks
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - uses: databricks/setup-cli@v1.17.0
        with:
          version: 1.17.0

      - uses: astral-sh/setup-uv@v6 # bundle deploy builds the wheel with uv

      - name: Deploy
        run: databricks bundle deploy -t staging

      - name: Copy Azure SQL into Bronze (first run, or on request)
        env:
          INGEST_SQL: ${{ inputs.ingest_sql }}
        run: |
          exists=$(databricks tables exists heavden_staging.bronze.sql_watermarks | jq -r .table_exists)
          if [ "$exists" != "true" ] || [ "$INGEST_SQL" = "true" ]; then
            databricks bundle run sql_ingest -t staging
          else
            echo "Bronze already holds the source tables; skipping (re-run with ingest_sql to refresh)."
          fi

      - name: Run the pipeline
        run: databricks bundle run medallion -t staging

      # A smoke test: 2 days of data are too few for a good model, but every step runs
      # (load Gold, train, calibrate, MLflow, Unity Catalog registry) on the Databricks runtime.
      - name: Train and register the model
        run: databricks bundle run train -t staging

      - name: Score every patient-hour with the newest model
        run: databricks bundle run score -t staging

      # The sign-in at the start gives tokens that last about an hour, and the run can be longer
      # with the monitor's refresh: sign in again so the drift step can follow its job to the end.
      - name: Sign in to Azure again before the drift check
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Check for drift against the newest model's data
        run: databricks bundle run drift_check -t staging

      # A promotion or a rollback is an alias moved in the registry. This sets, reads and removes
      # a throwaway alias, so the first real one in prod is not also the first try.
      - name: Check that model aliases can be moved
        run: databricks bundle run model_ops -t staging --params action=selftest
