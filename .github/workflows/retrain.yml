# A retrain request (Plan.md §10.4). Started by prod-run when a drift check reaches "act"; it can
# also be started by hand with a check's result line. It shows what the check found, then waits
# for Kelvin in the retrain-approval environment: GitHub emails the request, and approving or
# rejecting it is the decision. Not every drift calls for a retrain (a sensor fault doesn't), so
# rejecting is a normal outcome: see docs/corpus/drift-incident-runbook.md.
#
# An approval runs prod's training job in retrain mode: the latest days are validation and test,
# all earlier history trains, and the new model becomes @challenger only if it beats NEWS2 and
# the current @champion. Nothing is promoted here: @champion changes only in a separate, approved
# step. The job can't know whether enough has happened since the drift began: approve only once
# there are enough outcomes under the new conditions (the runbook says how long to wait).

name: retrain

on:
  workflow_dispatch:
    inputs:
      check:
        description: "The drift check's result (the JSON after DRIFT_CHECK_RESULT in the job's output)"
        type: string
        required: true

permissions:
  contents: read

# One request at a time: a second "act" while one is waiting queues behind it.
concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: What the drift check found
        env:
          CHECK: ${{ inputs.check }}
        run: |
          jq -e . <<<"$CHECK" >/dev/null || { echo "::error::the check input is not JSON"; exit 1; }
          {
            echo "## Drift check: $(jq -r '.status | ascii_upcase' <<<"$CHECK")"
            echo
            jq -r '"- **Catalog:** \(.catalog), model version \(.model_version)",
                   "- **Episode:** \(.episode // "none")",
                   "- **Data window:** \(.window_start) to \(.window_end)",
                   "- **Outcomes known through:** \(.labels_through)",
                   "- **Check:** `\(.check_id)` in `\(.catalog).monitoring.drift_checks`"' <<<"$CHECK"
            echo
            echo "### Breaches ($(jq -r .n_act <<<"$CHECK") act, $(jq -r .n_warn <<<"$CHECK") warn)"
            echo
            jq -r '.breaches[] | "- \(.)"' <<<"$CHECK"
            echo
            echo "### Before approving"
            echo
            echo "| What the breaches look like | Likely cause | Decision |"
            echo "|---|---|---|"
            echo "| Inputs at **one site** (e.g. \`feature_psi spo2_mean_1h at SITE_B\`), performance fine | a device fault | **Reject**: fix the sensors |"
            echo "| \`missing_rate_change\` or \`quarantine_rate\` | a payload or pipeline change | **Reject**: fix the pipeline |"
            echo "| Inputs at **every site**, performance fine | a new mix of patients | **Reject** for now, check again when outcomes arrive |"
            echo "| \`auprc_drop\` or \`brier_rise\`, inputs stable | outcomes changed (e.g. a new protocol) | **Approve** |"
            echo
            echo "Details: notebook \`30_drift_check_and_psi\` and the Drift Incident Runbook (\`docs/corpus/drift-incident-runbook.md\`)."
          } >> "$GITHUB_STEP_SUMMARY"

  retrain:
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: retrain-approval # waits here for Kelvin; rejecting ends the request
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: azure-cli
    defaults:
      run:
        working-directory: databricks
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - uses: databricks/setup-cli@v1.17.0
        with:
          version: 1.17.0

      # The job prints its result on one line (TRAINING_RESULT {json}); without it this step
      # fails, so a run that said nothing is never reported as a new challenger.
      - name: Retrain on the latest data and compare with the champion
        shell: bash
        run: |
          databricks bundle run train -t prod --params mode=retrain 2>&1 | tee "$RUNNER_TEMP/train.log"
          result=$(grep -o 'TRAINING_RESULT {.*}' "$RUNNER_TEMP/train.log" | tail -1 | sed 's/^TRAINING_RESULT //')
          jq -e .version <<<"$result" >/dev/null || { echo "::error::the training job printed no result line"; exit 1; }
          {
            echo "## Retrained: version $(jq -r .version <<<"$result") ($(jq -r .model_type <<<"$result"))"
            echo
            if [ "$(jq -r .passed_gates <<<"$result")" = "true" ]; then
              echo "**Passed every gate: it is now \`@challenger\`.** \`@champion\` is unchanged until a promotion is approved."
            else
              echo "**Did not pass the gates: no alias.** \`@champion\` stays. The version is registered, so the attempt is on record."
            fi
            echo
            echo "| On the latest days (test) | New model | Champion |"
            echo "|---|---|---|"
            jq -r '.vs_champion | select(. != null) |
              "| AUPRC | \(.auprc * 1000 | round / 1000) | \(.champion_auprc * 1000 | round / 1000) |",
              "| Escalations flagged within the alert budget | \(.escalations_flagged * 100 | round)% of \(.escalations) | \(.champion_escalations_flagged * 100 | round)% |",
              "| Alerts per nurse per shift | \(.alerts_per_nurse_shift * 100 | round / 100) | \(.champion_alerts_per_nurse_shift * 100 | round / 100) |",
              "| Brier score | \(.brier * 10000 | round / 10000) | \(.champion_brier * 10000 | round / 10000) |"' <<<"$result"
            echo
            jq -r '.vs_champion | select(. != null) |
              "The new model has the higher AUPRC in **\(.auprc_better_share * 100 | round)%** of paired resamples of patient stays (gate: at least 75%)."' <<<"$result"
            echo
            jq -r '"Validation AUPRC \(.valid_auprc * 1000 | round / 1000) vs NEWS2 \(.news2_valid_auprc * 1000 | round / 1000). Rows: train \(.rows.train), validation \(.rows.valid), test \(.rows.test)."' <<<"$result"
          } >> "$GITHUB_STEP_SUMMARY"
