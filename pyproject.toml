[project]
name = "heavden-nexus-databricks"
version = "0.1.0"
description = "HeavDen-Nexus: end-to-end ML/AI analytics platform on Azure Databricks (synthetic healthcare data)"
readme = "README.md"
requires-python = ">=3.12"
# Lower bounds are the versions in Databricks serverless environment 6, where the training and
# scoring jobs run (databricks/requirements-serverless-env6.txt), so installing the package there
# never upgrades the runtime's own libraries. Local development uses the newer versions in uv.lock;
# CI runs the ML tests against both.
dependencies = [
    "cloudpickle>=3.1.1",
    "lightgbm>=4.6.0",
    "mlflow-skinny>=3.12.0",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7.2",
]

[dependency-groups]
dev = [
    # full MLflow (SQLite tracking store and registry) for local runs; Databricks needs only skinny
    "mlflow>=3.17.0",
    "pytest>=8.0",
    "ruff>=0.8",
    "nbstripout>=0.8",
    "httpx>=0.28.1",
]
notebooks = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "scipy>=1.14",
]
rag = [
    "faiss-cpu>=1.15.1",
    "fastembed>=0.9.0",
]
backend = [
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "openai>=3.26.1",
    "uvicorn[standard]>=0.54.0",
]
azure = [
    "mssql-python==1.14.0",
]
spark = [
    "pyspark==4.0.4",
    # Delta Lake for the tests of MERGE and change data feed (Linux only: on Windows, Delta
    # writes need Hadoop's winutils). 4.0.x is the line built for PySpark 4.0.
    "delta-spark==4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator", "databricks/src/heavden", "backend/heavden_api"]

[tool.hatch.build.targets.wheel.force-include]
# The assistant's documents ship with the code that publishes them (heavden.agent.publish)
"docs/corpus" = "heavden/agent/corpus_docs"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks provides spark, dbutils and display at runtime, and these notebooks add the
# deployed repo to sys.path before importing project code.
"notebooks/databricks/*" = ["F821", "E402"]
# Lakeflow pipeline files get `spark` from the pipeline runtime.
"databricks/src/pipelines/*" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["generator", "heavden", "heavden_api"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters with these calls as defaults; that's intended
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
